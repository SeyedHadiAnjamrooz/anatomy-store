<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Anatomy 3D Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<nav class="topnav">
  <div class="container topnav-inner">
    <a href="/" class="wordmark">ANATO<span class="dot">•</span>LAB</a>
  </div>
</nav>

<div class="auth-shell">
  <h1>Log in</h1>
  <p class="sub">Access your purchased models.</p>
  <form id="login-form">
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" required>
    </div>
    <p class="form-msg" id="msg"></p>
    <button class="btn btn-primary btn-block" type="submit">Log in</button>
  </form>
  <p class="sub" style="margin-top:18px;">No account yet? <a href="/register.html" style="color:var(--accent)">Sign up</a></p>
</div>

<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  msg.textContent = '';
  msg.className = 'form-msg';
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const res = await fetch('/api/auth/login', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ email, password })
  });
  const data = await res.json();
  if (!res.ok) { msg.textContent = data.error; msg.classList.add('error'); return; }
  const params = new URLSearchParams(location.search);
  location.href = params.get('next') || '/account.html';
});
</script>
</body>
</html>
